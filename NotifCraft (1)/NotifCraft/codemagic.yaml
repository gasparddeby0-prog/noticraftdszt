workflows:
  notifcraft-ipa:
    name: NotifCraft - Build IPA
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: "NotifCraft.xcodeproj"
        XCODE_SCHEME: "NotifCraft"
        BUNDLE_ID: "com.vincentdeby.notifcraft"
      # Ce groupe de variables doit être créé dans Codemagic
      # (Teams > Team settings > Environment variable groups > "appstore_credentials")
      # avec ta clé App Store Connect API. Voir README.md pour la marche à suivre.
      groups:
        - appstore_credentials

    triggering:
      events:
        - push

    scripts:
      - name: Installer XcodeGen
        script: |
          brew install xcodegen

      - name: Localiser project.yml dans le dépôt
        script: |
          PROJECT_FILE=$(find "$CM_BUILD_DIR" -maxdepth 4 -name "project.yml" | head -n 1)
          if [ -z "$PROJECT_FILE" ]; then
            echo "❌ Aucun project.yml trouvé dans le dépôt. Vérifie que le contenu du dossier NotifCraft a bien été uploadé sur GitHub."
            exit 1
          fi
          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          echo "project.yml trouvé dans : $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$CM_ENV"

      - name: Générer le projet Xcode à partir de project.yml
        script: |
          cd "$PROJECT_DIR"
          xcodegen generate

      - name: Configurer la signature de code
        script: |
          cd "$PROJECT_DIR"
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_ADHOC --create
          keychain add-certificates
          xcode-project use-profiles

      - name: Compiler et exporter le .ipa
        script: |
          cd "$PROJECT_DIR"
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - "**/*.ipa"
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - ton-email@exemple.com

  # ------------------------------------------------------------------
  # Deuxième workflow : .ipa NON SIGNÉ.
  # Aucun compte Apple Developer requis pour cette compilation.
  # L'ipa produit ici n'est pas installable tel quel sur un iPhone :
  # il doit être signé au moment de l'installation par un outil comme
  # Sideloadly ou AltStore, avec un simple Apple ID gratuit (voir README).
  # ------------------------------------------------------------------
  notifcraft-ipa-unsigned:
    name: NotifCraft - Build IPA (non signé)
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: "NotifCraft.xcodeproj"
        XCODE_SCHEME: "NotifCraft"

    triggering:
      events:
        - push

    scripts:
      - name: Installer XcodeGen
        script: |
          brew install xcodegen

      - name: Localiser project.yml dans le dépôt
        script: |
          PROJECT_FILE=$(find "$CM_BUILD_DIR" -maxdepth 4 -name "project.yml" | head -n 1)
          if [ -z "$PROJECT_FILE" ]; then
            echo "❌ Aucun project.yml trouvé dans le dépôt. Vérifie que le contenu du dossier NotifCraft a bien été uploadé sur GitHub."
            exit 1
          fi
          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          echo "project.yml trouvé dans : $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$CM_ENV"

      - name: Générer le projet Xcode à partir de project.yml
        script: |
          cd "$PROJECT_DIR"
          xcodegen generate

      - name: Compiler sans signature
        script: |
          cd "$PROJECT_DIR"
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Assembler le .ipa
        script: |
          cd "$PROJECT_DIR"
          mkdir -p Payload
          cp -r "build/Build/Products/Release-iphoneos/NotifCraft.app" Payload/
          zip -r NotifCraft-unsigned.ipa Payload

    artifacts:
      - "**/NotifCraft-unsigned.ipa"

    publishing:
      email:
        recipients:
          - ton-email@exemple.com
